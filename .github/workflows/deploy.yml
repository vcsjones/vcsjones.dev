name: Deployment
concurrency: live

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: live
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3.1'
    - name: Setup Tooling
      run: |
        sudo apt-get update -y
        sudo apt-get install -y webp exiftool pngcrush gzip brotli
    - name: Build
      run: |
        bundle install
        bundle exec jekyll build
        bundle exec rake
    - name: Tailscale
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ secrets.TS_OIDC_CLIENT_ID }}
        audience: ${{ secrets.TS_OIDC_AUDIENCE }}
        tags: tag:ci
    - name: Copy To Production
      run: |
        mkdir -p ~/.ssh
        echo "vcsjones-dev ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKK5Bi4tOamAsNJpQpmk3bBwDN0hEB8dHTaeOdtJN6OU" >> ~/.ssh/known_hosts
        rsync -a --delete _site/ deployer@vcsjones-dev:/var/wwwroot/vcsjones.dev
        rsync --ignore-times _server/Caddyfile deployer@vcsjones-dev:/etc/caddy/Caddyfile
        ssh deployer@vcsjones-dev 'sudo systemctl reload caddy.service'
